name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect compose file
        id: compose
        shell: bash
        run: |
          if [ -f docker-compose.yml ]; then
            echo "file=docker-compose.yml" >> "$GITHUB_OUTPUT"
          elif [ -f compose.yml ]; then
            echo "file=compose.yml" >> "$GITHUB_OUTPUT"
          elif [ -f deploy/docker-compose.yml ]; then
            echo "file=deploy/docker-compose.yml" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker compose config
        if: ${{ steps.compose.outputs.file != '' }}
        run: docker compose -f "${{ steps.compose.outputs.file }}" config

      - name: Skip compose check
        if: ${{ steps.compose.outputs.file == '' }}
        run: echo "No compose file found, skip."

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend
        id: fe
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: ${{ steps.fe.outputs.exists == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        if: ${{ steps.fe.outputs.exists == 'true' }}
        working-directory: frontend
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        if: ${{ steps.fe.outputs.exists == 'true' }}
        working-directory: frontend
        run: npm run build

      - name: Skip frontend
        if: ${{ steps.fe.outputs.exists != 'true' }}
        run: echo "No frontend/package.json, skip."

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend
        id: be
        shell: bash
        run: |
          if [ -f backend/requirements.txt ] || [ -f backend/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: ${{ steps.be.outputs.exists == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps from requirements.txt
        if: ${{ steps.be.outputs.exists == 'true' }}
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          fi
          pip install pytest

      - name: Run tests if tests dir exists
        if: ${{ steps.be.outputs.exists == 'true' }}
        working-directory: backend
        shell: bash
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory, skip."
          fi

      - name: Skip backend
        if: ${{ steps.be.outputs.exists != 'true' }}
        run: echo "No backend config found, skip."
