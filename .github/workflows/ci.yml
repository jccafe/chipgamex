name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose config
        run: docker compose config

  frontend-build:
    name: Frontend Build (if exists)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

  backend-test:
    name: Backend Test (if exists)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/requirements.txt') != '' || hashFiles('backend/pyproject.toml') != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (requirements)
        if: ${{ hashFiles('backend/requirements.txt') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install deps (pyproject)
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Run tests (if tests exist)
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory, skip."
          fi
